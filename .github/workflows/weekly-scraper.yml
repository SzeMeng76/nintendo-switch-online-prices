name: Weekly Nintendo Switch Online Price Scraper

on:
  schedule:
    # 每周日 UTC 0:00 运行（���京时间周日���午 8:00）
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 支持���动���发

jobs:
  scrape-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Run scraper
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python nintendo.py
          python nintendo_rate_converter.py

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update Nintendo Switch Online prices - $(date +'%Y-%m-%d')" && git push)
